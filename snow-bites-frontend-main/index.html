    <script>
      (function() {
        // Prevent DOM reconciliation crash from browser extensions or translation
        if (typeof Node === 'function' && Node.prototype) {
          var origRC = Node.prototype.removeChild;
          Node.prototype.removeChild = function(child) {
            if (child && child.parentNode !== this) {
              if (child.parentNode) {
                return child.parentNode.removeChild(child);
              }
              return child;
            }
            return origRC.apply(this, arguments);
          };

          var origIB = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, refNode) {
            if (refNode && refNode.parentNode !== this) {
              if (refNode.parentNode) {
                return refNode.parentNode.insertBefore(newNode, refNode);
              }
              return this.appendChild(newNode);
            }
            return origIB.apply(this, arguments);
          };
        }

        var h = window.location.hostname;
        if (h && h !== 'localhost' && h !== '127.0.0.1' && !h.includes('.dev') && !h.includes('ngrok')) {
          window.__SNOW_BITES_API_URL__ = window.location.origin + '/index.php/api';
        }
      })();
    </script>
